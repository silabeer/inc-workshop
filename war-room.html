<html lang="ru">
<head>
<meta charset="utf-8">

<title>War room — интерактивный воркшоп</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F1E33'/%3E%3Crect x='6' y='18' width='5' height='8' fill='%23FFD84D'/%3E%3Crect x='13.5' y='12' width='5' height='14' fill='%23FFD84D'/%3E%3Crect x='21' y='6' width='5' height='20' fill='%23C8102E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0b0e12;--bg2:#10151c;--panel:#151b23;--panel2:#1b232d;--line:#26303c;--line2:#34404e;
  --text:#e6eaf0;--muted:#8b96a5;--dim:#5c6673;
  --amber:#f5a524;--red:#ff4d4f;--green:#2fd07a;--cyan:#4fc3f7;--violet:#b48cff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#app{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--cyan)}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:600}
button.danger{background:#3a1416;border-color:#7a2a2e;color:#ffb3b5}
button.ok{background:#12351f;border-color:#1f6b3c;color:#a7f0c3}
button.sm{padding:4px 9px;font-size:13px;border-radius:5px}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.5;background:#0a0d11;border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:0;white-space:pre}
code{font-family:var(--mono);font-size:.92em;background:#0a0d11;padding:1px 5px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:28px;font-weight:700}h2{font-size:18px;font-weight:600}h3{font-size:15px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.red{color:#ffb3b5;border-color:#7a2a2e;background:#2a1214}
.pill.amber{color:#ffd58a;border-color:#7a5a1e;background:#2a2010}
.pill.green{color:#a7f0c3;border-color:#1f6b3c;background:#0f2a1a}
.pill.cyan{color:#bfe9ff;border-color:#1f5a7a;background:#0f2230}
.pill.violet{color:#e2d4ff;border-color:#5a3f8a;background:#1e1530}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,14,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar .clock{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bar .money{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--amber)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);padding:10px 14px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);background:var(--panel);border:1px solid var(--line);border-bottom-color:var(--panel)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.item.pending{border-style:dashed}
.item.done{opacity:.75}
.item .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.item .tool{font-family:var(--mono);font-size:13px}
.cost{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;background:var(--cyan);transition:width .5s linear}
.k{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:#2a2010;color:#ffd58a;border:1px solid #7a5a1e}
.wallcard{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--line2);border-radius:6px;padding:8px 10px;font-size:14px}
.wallcard.key{border-left-color:var(--amber)}
.wallcard .who{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 8px;border:1px solid var(--line2);border-radius:999px;cursor:pointer;background:var(--bg2)}
.chip.on{border-color:var(--amber);color:#ffd58a;background:#2a2010}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:10px 14px;border-radius:8px;z-index:50;max-width:90vw}
.hidden{display:none!important}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rolecard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.rolecard b{font-size:16px}
.rolecard.taken{opacity:.55}
.hint{font-size:13px;color:var(--muted)}
.status-tier{font-family:var(--mono);font-size:13px}
/* projector */
.proj{height:100%;display:grid;grid-template-rows:auto 1fr;background:#07090c;color:#e6eaf0}
.proj .top{display:flex;align-items:center;gap:28px;padding:14px 28px;border-bottom:1px solid #1d242d;flex-wrap:wrap}
.proj .top .clock{font-family:var(--mono);font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.proj .top .money{font-family:var(--mono);font-size:44px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.proj .top .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.proj .main{display:grid;grid-template-columns:34% 36% 30%;gap:0;min-height:0}
.proj .col{padding:18px 22px;border-right:1px solid #1d242d;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.proj .col:last-child{border-right:0}
.panic{display:flex;gap:12px;align-items:stretch;flex:1;min-height:0}
.panic .segs{display:flex;flex-direction:column-reverse;gap:4px;width:64px}
.panic .segs i{flex:1;background:#1a222c;border-radius:3px;border:1px solid #232d38}
.panic .segs i.on{background:var(--green);border-color:transparent}
.panic .segs i.on.a{background:var(--amber)}
.panic .segs i.on.r{background:var(--red)}
.panic .segs i.on.m{background:#ff1a1a;box-shadow:0 0 12px #ff1a1a}
.panic .info{display:flex;flex-direction:column;gap:10px;justify-content:center}
.panic .num{font-family:var(--mono);font-size:96px;font-weight:600;line-height:1}
.panic .tier{font-size:22px;font-weight:600}
.penalty{background:#151b23;border:1px solid #26303c;border-radius:8px;padding:12px 16px;font-family:var(--mono);font-size:20px}
.chart{background:#0c1015;border:1px solid #1d242d;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-height:0}
.chart .t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chart .v{font-family:var(--mono);font-size:26px;font-weight:600}
.chart canvas{width:100%;height:100%;flex:1;min-height:60px}
.wall{display:flex;flex-direction:column;gap:6px;overflow:hidden;flex:1;min-height:0}
.feed{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:3px;overflow:hidden;flex:1;min-height:0}
.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .warn,.feed .warning{color:#ffd58a}.feed .danger{color:#ffb3b5}.feed .success{color:#a7f0c3}.feed .info{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(3,5,8,.86);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.overlay .callcard{background:#141a22;border:2px solid var(--red);border-radius:16px;padding:40px 56px;text-align:center;box-shadow:0 0 80px rgba(255,77,79,.35);animation:ring 1.2s ease-in-out infinite}
.overlay .callcard .who{font-size:44px;font-weight:700}
.overlay .callcard .cd{font-family:var(--mono);font-size:80px;font-weight:600;color:var(--red);line-height:1.1}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
.overlay.end .callcard{border-color:var(--green);box-shadow:0 0 80px rgba(47,208,122,.3);animation:none}
.overlay.end.fail .callcard{border-color:var(--red)}
.qr{background:#fff;padding:8px;border-radius:6px;display:inline-block}
.gmgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.gmgrid{grid-template-columns:1fr}.proj .main{grid-template-columns:1fr;overflow:auto}.proj .col{border-right:0;border-bottom:1px solid #1d242d}.proj .top .clock{font-size:40px}.proj .top .money{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{font-weight:500;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted)}
.landing{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.landing .box{max-width:720px;width:100%}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big a{display:block;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.big a b{display:block;font-size:18px;margin-bottom:6px}
.big a:hover{border-color:var(--amber)}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script>/* реестр пакетов: объявлен до загрузки паков */
window.SCENARIOS={};
window.SCENARIO=function(o){if(window.SCENARIOS[o.id])throw new Error('дубль пакета '+o.id);window.SCENARIOS[o.id]=o;};
</script>
<script src="engine.js"></script>
<script src="scenarios/phantom-network.js"></script>
<script src="scenarios/expired-cert.js"></script>

<script>
/* =========================================================
   ДВИЖОК ВОРКШОПА — сценарно-независимый рендер и сетевой слой.
   Контент живёт в scenarios/*.js, экономика и автопилот — в engine.js.
   ========================================================= */
const P=()=>activePack();
const ROLES=()=>P().roles;
const ROLE_ORDER=()=>P().roleOrder;
const START=()=>P().startScreens;
const ART=()=>P().artifacts;
const ARTM=()=>P().mitigations;
const ARTBY=()=>Object.fromEntries(ART().map(a=>[a.id,a]));
const MITBY=()=>Object.fromEntries(ARTM().map(m=>[m.id,m]));
const KEYS=()=>[...new Set(ART().map(a=>a.key).filter(Boolean))].sort();
const keyTotal=()=>KEYS().length;
function activePack(){
  const all=Object.values(window.SCENARIOS);
  const id=(S.g&&S.g.scenarioId)||lobbySel().scenarioId;
  return window.SCENARIOS[id]||all[0];
}
/* Учебный режим: пакет может смягчать расписание (реже авто-паника, дольше тишина). */
function effectivePack(){
  const pack=activePack();const g=G();
  if(g.mode!=='training'||!pack.trainingOverrides)return pack;
  return {...pack,panic:{...pack.panic,...pack.trainingOverrides.panic}};
}

/* ===================== Состояние и синхронизация ===================== */
const S={g:null,players:{},wall:[],hyps:[],props:[],statuses:[],isOwner:true,online:true,role:null,view:null,tab:null,rev:0,lobbySel:null};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),2800);}

/* Хранилище. Два бэкенда:
   - http: страница отдана server.js → состояние на сервере, обновления по SSE,
     записи условные (expectRev → 409 при рассинхроне, вызывающий решает)
   - local: файл открыт напрямую → localStorage + BroadcastChannel (вкладки одного браузера) */
const EMPTY=()=>({game:{status:'LOBBY',panic:0,applied:[],rateSegments:[],events:[]},players:{},wall:{},hypotheses:{},proposals:{},statuses:{}});
let STATE=EMPTY();
const isHttp=location.protocol.startsWith('http');
const waiters=new Set();
const store={
  mode:isHttp?'http':'local',
  apply(st){STATE=st||EMPTY();S.rev=STATE.rev||0;S.g=STATE.game;S.players=STATE.players||{};const arr=o=>Object.entries(o||{}).map(([id,d])=>({id,...d})).sort((a,b)=>(a.t||0)-(b.t||0));S.wall=arr(STATE.wall);S.hyps=arr(STATE.hypotheses);S.props=arr(STATE.proposals);S.statuses=arr(STATE.statuses);waiters.forEach(f=>f());waiters.clear();render();},
  whenRefreshed(prevRev){if((STATE.rev||0)!==prevRev)return Promise.resolve();return new Promise(res=>{const to=setTimeout(()=>{waiters.delete(f);res();},1500);const f=()=>{clearTimeout(to);waiters.delete(f);res();};waiters.add(f);});},
  async write(op){ // {col,id,doc} | {col,id,del:true} | {reset:true, archive?}
    if(this.mode==='http'){
      const attempt=async()=>{
        const r=await fetch('/write',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...op,expectRev:STATE.rev})});
        if(r.status===409)throw{code:409};
        if(!r.ok)throw new Error(r.status);
        // Сервер отдаёт новый rev в x-rev. SSE с тем же rev может прийти раньше ответа,
        // поэтому не инкрементируем вслепую, а берём максимум.
        const nr=+r.headers.get('x-rev');if(nr>(STATE.rev||0)){STATE.rev=nr;S.rev=nr;}
      };
      try{await attempt();}
      catch(e){
        if(e&&e.code===409){
          const prev=STATE.rev;await this.whenRefreshed(prev);
          try{await attempt();}catch(e2){toast('Конфликт изменений, попробуйте ещё раз');throw e2;}
        }else toast('Сервер не ответил: '+(e.message||e));
      }
      return;
    }
    if(op.reset)STATE=EMPTY();else if(op.col==='game')STATE.game=op.doc;else if(op.del)delete STATE[op.col][op.id];else STATE[op.col][op.id]=op.doc;
    try{localStorage.setItem('pn.state',JSON.stringify(STATE));}catch(e){toast('localStorage недоступен');}
    try{store.bc&&store.bc.postMessage('changed');}catch(e){}
    this.apply(STATE);
  },
  async init(){
    if(this.mode==='http'){
      try{const r=await fetch('/state');this.apply(await r.json());}catch(e){S.online=false;render();}
      const es=new EventSource('/events');es.onmessage=ev=>{try{this.apply(JSON.parse(ev.data));}catch(e){}};es.onerror=()=>{S.online=false;render();};es.onopen=()=>{if(!S.online){S.online=true;render();}};
    }else{
      const load=()=>{try{const raw=localStorage.getItem('pn.state');this.apply(raw?JSON.parse(raw):EMPTY());}catch(e){this.apply(EMPTY());}};
      load();
      try{this.bc=new BroadcastChannel('pn');this.bc.onmessage=load;}catch(e){}
      window.addEventListener('storage',e=>{if(e.key==='pn.state')load();});
    }
  }
};
const setDoc=(col,id,doc)=>store.write({col,id,doc});
const delDoc=(col,id)=>store.write({col,id,del:true});

async function boot(){
  route();
  window.addEventListener('hashchange',route);
  setInterval(tick,500);
  await store.init();
  render();
}
function route(){
  const h=location.hash.replace('#','');
  const [v,arg]=h.split('/');
  S.view=v||'home';S.role=arg||null;
  try{if(v==='play'&&!arg){const r=localStorage.getItem('pn.role');if(r&&ROLES()[r]){location.hash='#play/'+r;return;}}}catch(e){}
  S.tab=null;render();
}
function G(){return S.g||{status:'LOBBY',panic:0,applied:[],rateSegments:[],events:[],fired:{}};}
function lobbySel(){return (S.g&&S.g.lobbySel)||S.lobbySel||{scenarioId:Object.keys(window.SCENARIOS)[0],mode:'standard'};}
async function setLobbySel(scenarioId,mode){S.lobbySel={scenarioId,mode};if(G().status==='LOBBY'){try{await gmWrite({lobbySel:{scenarioId,mode}});}catch(e){}}else render();}

/* ---- GM writes ---- */
async function gmWrite(patch,eventMsg,sev){
  const g={...G(),...patch};
  if(eventMsg){const ev=[...(g.events||[]),{t:Math.round(ENGINE.gameSec(g)),msg:eventMsg,sev:sev||'info'}];g.events=ev.slice(-150);}
  // ставка: добавить сегмент, если изменилась
  const r=ENGINE.currentRate(g,P());const segs=[...(g.rateSegments||[])];const last=segs[segs.length-1];
  if(g.status!=='LOBBY'&&(!last||last.rate!==r)) segs.push({t:Math.round(ENGINE.gameSec(g)),rate:r});
  g.rateSegments=segs;
  S.g=g;render();
  await setDoc('game',null,g);
}
async function setPanic(delta,why){
  const g=G();const p=Math.max(0,Math.min(20,(g.panic||0)+delta));
  const log=[...(g.panicLog||[]),{t:Math.round(ENGINE.gameSec(g)),d:delta,why}].slice(-80);
  await gmWrite({panic:p,panicLog:log},`Паника ${delta>0?'+':''}${delta} → ${p}: ${why}`,delta>0?'warning':'success');
}

/* ---- Исполнитель автопилота: любая вкладка (пульт/проектор) считает план
   и шлёт одну условную запись; 409 — другая вкладка успела первой. ---- */
let autoBusy=false;
async function runAutopilot(){
  if(autoBusy)return;
  const g=G();if(!g||g.status!=='ACTIVE')return;
  autoBusy=true;
  try{
    const plan=ENGINE.planAutopilot(STATE,effectivePack(),Date.now());
    if(!plan)return;
    const ng={...g,...plan.patch};
    if(plan.events.length){const ev=[...(ng.events||[]),...plan.events.map(e=>({t:Math.round(ENGINE.gameSec(ng,Date.now())),msg:e.msg,sev:e.sev||'info'}))];ng.events=ev.slice(-150);}
    const r=ENGINE.currentRate(ng,P());const segs=[...(ng.rateSegments||[])];const last=segs[segs.length-1];
    if(!last||last.rate!==r)segs.push({t:Math.round(ENGINE.gameSec(ng,Date.now())),rate:r});
    ng.rateSegments=segs;
    S.g=ng;render();
    await store.write({col:'game',doc:ng});
    for(const pr of (plan.props||[])){try{await setDoc('proposals',pr.id,pr.doc);}catch(e){}}
  }catch(e){/* 409 или сеть: свежее состояние придёт по SSE, следующий тик пересчитает */}
  finally{autoBusy=false;}
}
async function endGame(status,why){const g=G();await gmWrite({status,endedSec:Math.round(ENGINE.gameSec(g)),...(g.call&&g.call.active?{call:{...g.call,active:false}}:{})},(status==='RESOLVED'?'RESOLVED: ':'FAILED: ')+why,status==='RESOLVED'?'success':'danger');}

/* ---- Player writes ---- */
function myPlayer(){return S.players[S.role]||null;}
async function pWrite(role,patch){const cur=S.players[role]||{};const next={...cur,...patch};S.players[role]=next;render();await setDoc('players',role,next);}
function costMult(){const g=G();return ENGINE.tierOf(g.panic||0,effectivePack().panic.tiers).cost;}
async function requestArtifact(id){
  const a=ARTBY()[id];const me=myPlayer()||{};const g=G();
  if(g.status!=='ACTIVE'){toast('Инцидент ещё не запущен');return;}
  if(me.inFlight&&Date.now()<me.inFlight.readyAt){toast('У вас уже есть запрос в полёте');return;}
  if((me.received||[]).some(r=>r.id===id)){toast('Уже получено');return;}
  let cost=Math.round(a.cost*costMult());
  const ic=S.players.commander;if(ic&&ic.syncAt&&ic.syncAt>(me.lastReqAt||0)){cost=0;}
  if(me.freeNext===id){cost=0;}
  const scoutX2=S.role==='scout'&&g.scoutX2&&!me.scoutX2Used;
  if(scoutX2){cost*=2;toast('Графана тормозит: цена ×2');}
  const readyAt=Date.now()+cost*1000;
  await pWrite(S.role,{inFlight:{id,startedAt:Date.now(),readyAt,cost},lastReqAt:Date.now(),freeNext:null,...(scoutX2?{scoutX2Used:true}:{})});
}

let lastRenderSec=-1;
function tick(){
  const g=G();const T=ENGINE.gameSec(g);
  document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=fmtT(T));
  document.querySelectorAll('[data-money]').forEach(el=>el.textContent=fmtRub(ENGINE.burned(g)));
  document.querySelectorAll('[data-cd]').forEach(el=>{const end=+el.dataset.cd;el.textContent=fmtT(Math.max(0,(end-Date.now())/1000));});
  document.querySelectorAll('[data-prog]').forEach(el=>{const [a,b]=el.dataset.prog.split(',').map(Number);el.style.width=Math.min(100,Math.max(0,(Date.now()-a)/(b-a)*100))+'%';});
  if(g.call&&g.call.active){document.querySelectorAll('[data-callcd]').forEach(el=>el.textContent=fmtT(Math.max(0,(g.call.dur||180)-(T-g.call.startedAt))));}
  if(S.view==='play'){const me=myPlayer();if(me&&me.inFlight&&Date.now()>=me.inFlight.readyAt&&!tick._c){tick._c=true;completeInFlight().finally(()=>tick._c=false);}}
  if(S.view==='gm'||S.view==='projector')runAutopilot();
  if(S.view==='projector'){drawCharts();audioTick();}
  if(Math.floor(T)!==lastRenderSec&&(S.view==='play'||S.view==='gm')&&Math.floor(T)%10===0){lastRenderSec=Math.floor(T);render();}
}

const DEFAULT_CHARTS=[{key:'err',title:'Ошибки',max:100,color:'#ff4d4f',unit:' %',digits:1,idle:0.3,transient:60}];
const CHARTS=()=>P().charts||DEFAULT_CHARTS;
const chartMax=(c,tel)=>typeof c.max==='function'?c.max(tel):c.max;
const chartFmt=(c,v,tel)=>c.format?c.format(v,tel):(c.digits?v.toFixed(c.digits):Math.round(v))+(c.unit||'');
let charts={};const series={};let seriesPack=null;
function initCharts(){charts={};CHARTS().forEach(c=>{const el=document.getElementById('ch-'+c.key);if(el)charts[c.key]=el;});}
function drawCharts(){
  const g=G();const tel=P().telemetry(g);
  if(seriesPack!==P().id){seriesPack=P().id;Object.keys(series).forEach(k=>delete series[k]);}
  const transient=g.transientUntil&&Date.now()<g.transientUntil;
  const live=g.status==='ACTIVE'||g.status==='PAUSED';
  const jitter=(v,j)=>v+(Math.random()-.5)*j;
  CHARTS().forEach(c=>{
    const max=chartMax(c,tel);const real=+tel[c.key]||0;const j=c.jitter!=null?c.jitter:max*0.02;
    let v=g.status==='LOBBY'?(c.idle!=null?c.idle:0):!live?real:(transient&&c.transient!=null?jitter(c.transient,j*3):jitter(real,j));
    (series[c.key]=series[c.key]||[]).push(Math.max(0,Math.min(max,v)));
    while(series[c.key].length>240)series[c.key].shift();
    const el=charts[c.key];if(!el)return;const r=el.getBoundingClientRect();if(!r.width)return;
    el.width=r.width*devicePixelRatio;el.height=r.height*devicePixelRatio;const x=el.getContext('2d');x.scale(devicePixelRatio,devicePixelRatio);const W=r.width,H=r.height;
    x.clearRect(0,0,W,H);x.strokeStyle='#1d242d';x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,H*i/4);x.lineTo(W,H*i/4);x.stroke();}
    const s=series[c.key];if(s.length<2)return;x.beginPath();s.forEach((val,i)=>{const px=i/(240-1)*W,py=H-(val/max)*H;i?x.lineTo(px,py):x.moveTo(px,py);});x.strokeStyle=c.color;x.lineWidth=2;x.stroke();
    x.lineTo((s.length-1)/(240-1)*W,H);x.lineTo(0,H);x.closePath();x.fillStyle=c.color+'22';x.fill();
    const last=s[s.length-1];x.fillStyle=c.color;x.beginPath();x.arc((s.length-1)/(240-1)*W,H-(last/max)*H,3,0,7);x.fill();
    const lbl=document.getElementById('v-'+c.key);if(lbl)lbl.textContent=chartFmt(c,last,tel);
  });
}

function buildFeed(st,pack){
  const g=(st&&st.game)||{};
  const arr=o=>Object.entries(o||{}).map(([id,d])=>({id,...d})).sort((a,b)=>(a.t||0)-(b.t||0));
  const wall=arr(st&&st.wall),props=arr(st&&st.proposals),statuses=arr(st&&st.statuses),hyps=arr(st&&st.hypotheses);
  const RO=pack.roles,MIT=Object.fromEntries(pack.mitigations.map(m=>[m.id,m]));
  const out=[...(g.events||[])];
  wall.forEach(w=>out.push({t:w.t,msg:`${RO[w.role]?.short||w.role}: на стену «${w.summary}»`,sev:w.key?'success':'info'}));
  props.forEach(p=>{out.push({t:p.t,msg:`${RO[p.role]?.short} предлагает ${p.mitId}: ${MIT[p.mitId]?.title||''}${(p.cards||[]).length?'':' (вслепую)'}`,sev:'warning'});if(p.goAt!=null)out.push({t:p.goAt,msg:`IC: Go на ${p.mitId}`,sev:'warning'});});
  statuses.forEach(s=>out.push({t:s.t,msg:`Статус-пейдж: «${s.text.slice(0,90)}»`,sev:'info'}));
  hyps.forEach(h=>out.push({t:h.t,msg:`Гипотеза: ${h.text} [${h.status}]`,sev:'info'}));
  return out.sort((a,b)=>a.t-b.t);
}

function armAudio(){try{audio.ctx=audio.ctx||new (window.AudioContext||window.webkitAudioContext)();audio.ctx.resume();audio.armed=true;beep(880,.08);render();}catch(e){}}
function beep(f,d,type='sine',vol=.15){if(!audio.armed||!audio.ctx)return;const o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(audio.ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.ctx.currentTime+d);o.stop(audio.ctx.currentTime+d);}
function audioTick(){const g=G();if(!audio.armed)return;
  if(g.call&&g.call.active){if(!audio.ringing){audio.ringing=true;audio.ringT=setInterval(()=>{beep(1046,.15,'square',.08);setTimeout(()=>beep(1318,.15,'square',.08),180);},900);}}
  else if(audio.ringing){audio.ringing=false;clearInterval(audio.ringT);}
  const p=g.panic||0;if(p>=15&&audio.lastPanic<15){[0,300,600].forEach(d=>setTimeout(()=>beep(440,.28,'sawtooth',.12),d));}
  if(p!==audio.lastPanic){if(p>audio.lastPanic)beep(220,.12,'triangle',.1);audio.lastPanic=p;}
  if(g.status!==audio.lastStatus){if(audio.lastStatus&&g.status==='ACTIVE'){[0,150,300,450].forEach(d=>setTimeout(()=>beep(1760,.1,'square',.1),d));}if(g.status==='RESOLVED'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*140));}audio.lastStatus=g.status;}
  const keyCount=S.wall.filter(w=>w.key).length;if(audio.lastKeys!=null&&keyCount>audio.lastKeys)beep(1500,.05,'square',.06);audio.lastKeys=keyCount;

async function startIncident(scenarioId,mode){
  const pk=window.SCENARIOS[scenarioId];if(!pk)return;
  S.lobbySel={scenarioId,mode};
  await gmWrite({status:'ACTIVE',startedAt:Date.now(),pausedTotal:0,pausedAt:null,panic:0,applied:[],cleared:false,storm:false,events:[],rateSegments:[],lastAutoPanic:0,lastStatusAt:0,silenceFlagAt:0,call:null,hardStop:false,endedSec:null,scenarioId,mode:mode||'standard',fired:{}},pk.alert||'🔥 [CRITICAL] инцидент запущен','danger');
}
async function pauseIncident(){await gmWrite({status:'PAUSED',pausedAt:Date.now()},'Пауза','info');}
async function resumeIncident(){const g=G();await gmWrite({status:'ACTIVE',pausedTotal:(g.pausedTotal||0)+(Date.now()-g.pausedAt),pausedAt:null},'Продолжаем','info');}
async function startCall(){const g=G();const cc=P().schedule.cioCall;if(!cc)return;await gmWrite({call:{active:true,caller:cc.caller,startedAt:Math.round(ENGINE.gameSec(g)),ticks:0,dur:cc.durationSec}},'📞 Входящий звонок: '+cc.caller,'danger');}
async function endCall(ok){const g=G();await gmWrite({call:{...g.call,active:false,result:ok?'ok':'fail'}},ok?'Звонок CIO отбит: влияние, гипотеза, чекпойнт':'Звонок CIO провален',ok?'success':'danger');if(ok)await setPanic(-2,'отбитый звонок CIO');}
async function rollEvent(){const we=P().schedule.worldEvents;if(!we)return;const n=1+Math.floor(Math.random()*10);const e=we.table[n];
  if(!e){await gmWrite({lastEvent:{n,t:'тихо',d:'Ничего не произошло.'}},`Ивент d10=${n}: тихо`,'info');return;}
  const fx=ENGINE.eventPatch(e,Date.now());await gmWrite({...fx.patch,lastEvent:{n,t:e.t,d:e.d||''}},`Ивент d10=${n}: ${e.t}`,'warning');if(fx.panic)await setPanic(fx.panic,e.t);}
async function markKey(cardId,key){const w=S.wall.find(x=>x.id===cardId);if(!w)return;const prev=w.key;const {id:_,...body}=w;await setDoc('wall',cardId,{...body,key:key||null});if(key&&!prev)await setPanic(-1,'ключевая улика '+key);}
async function rateStatus(id,score,over){const s=S.statuses.find(x=>x.id===id);if(!s)return;const {id:_,...body}=s;await setDoc('statuses',id,{...body,score,over});const g=G();await gmWrite({lastStatusAt:Math.round(ENGINE.gameSec(g)),storm:(score>=2)?false:g.storm},`Статус-апдейт оценён: ${score} из 3${over?' + обещан срок':''}`,'info');if(over)await setPanic(1,'обещан срок / ложная причина');else if(score===3)await setPanic(-2,'статус-апдейт 3 из 3');else if(score===2)await setPanic(-1,'статус-апдейт 2 из 3');}
async function gmGo(id){await updProp(id,{status:'go',goAt:Math.round(ENGINE.gameSec(G()))});}
async function gmApply(id){const p=S.props.find(x=>x.id===id);if(!p)return;await updProp(id,{status:'done',doneAt:Math.round(ENGINE.gameSec(G()))});await execMit(p.mitId,p);}
/* Единая точка применения эффекта действия (пульт и исполнитель автопилота). */
async function execMit(mitId,p){
  const pk=P();const m=MITBY()[mitId];if(!m)return;
  const g=G();const before=pk.telemetry(g).mult;
  const A=new Set(g.applied||[]);
  let eff={add:[mitId]};if(m.apply)eff=m.apply(new Set(A),g,pk)||{};
  (eff.add||[]).forEach(x=>A.add(x));(eff.remove||[]).forEach(x=>A.delete(x));
  const patch={applied:[...A]};
  if(eff.set)Object.assign(patch,eff.set);
  if(eff.transientSec)patch.transientUntil=Date.now()+eff.transientSec*1000;
  let msg=eff.msg||(`Выполнено ${mitId}: ${m.title}`);let sev=eff.sev||'success';
  const blind=p&&!(p.cards||[]).length;
  if(p&&m.review&&!p.reviewedBy){const d=1+Math.floor(Math.random()*10);msg+=` · без ревью, d10=${d}`;if(d<=2){msg+=' — ОШИБКА В КОНФИГЕ, соседний сервис упал';sev='danger';}}
  await gmWrite(patch,msg,sev);
  if(m.trap)await setPanic(m.trapDelta||2,'ловушка '+mitId);
  if(blind)await setPanic(2,'действие вслепую '+mitId);
  const g2=G();const after=pk.telemetry(g2).mult;
  if(!(g2.fired&&g2.fired.stab)&&after<=pk.money.stabilizeAtMult&&before>pk.money.stabilizeAtMult){await gmWrite({fired:{...(g2.fired||{}),stab:1}});await setPanic(-3,'стабилизация сервиса');}
}
async function unapply(id){const g=G();await gmWrite({applied:(g.applied||[]).filter(x=>x!==id)},`Снят эффект ${id}`,'info');}
async function resetAll(){if(!confirm('Стереть состояние игры, игроков, стену, гипотезы и предложения? Игра уйдёт в архив.'))return;
  const g=G();const summary={scenarioId:g.scenarioId||lobbySel().scenarioId,mode:g.mode||lobbySel().mode,status:g.status,endedSec:g.endedSec||Math.round(ENGINE.gameSec(g)),burned:ENGINE.burned(g),at:new Date().toISOString()};
  S.archiveView=null;
  await store.write({reset:true,archive:summary});toast('Сброшено');}

/* ---------- Экспорт таймлайна для постмортема ---------- */
function buildReport(st,pack,atMs){
  const g=(st&&st.game)||{};
  const nowMs=atMs||Date.now();
  const arr=o=>Object.entries(o||{}).map(([id,d])=>({id,...d})).sort((a,b)=>(a.t||0)-(b.t||0));
  const wall=arr(st&&st.wall),props=arr(st&&st.proposals),statuses=arr(st&&st.statuses),hyps=arr(st&&st.hypotheses);
  const RO=pack.roles,MIT=Object.fromEntries(pack.mitigations.map(m=>[m.id,m]));
  const T=ENGINE.gameSec(g,nowMs);const feed=buildFeed(st,pack);
  const keys=wall.filter(w=>w.key);const blind=props.filter(p=>p.status==='done'&&!(p.cards||[]).length);
  const traps=props.filter(p=>p.status==='done'&&MIT[p.mitId]?.trap);
  const firstMention=(re)=>{const e=feed.find(x=>re.test(x.msg));return e?fmtT(e.t):'не прозвучало';};
  const gaps=(()=>{const ts=[0,...statuses.map(s=>s.t),Math.round(T)];let m=0;for(let i=1;i<ts.length;i++)m=Math.max(m,ts[i]-ts[i-1]);return fmtT(m);})();
  const sec=(t,rows)=>rows.length?`\n## ${t}\n\n${rows.join('\n')}\n`:'';
  return `# Постмортем: «${pack.title}»

Дата: ${new Date().toLocaleString('ru-RU')}
Кейс: ${pack.title} v${pack.version}${g.mode==='training'?' · учебный режим':''}
Итог: **${g.status}** на ${fmtT(g.endedSec??T)}

## Цифры

| Показатель | Значение |
| --- | --- |
| Сожжено | ${fmtRub(ENGINE.burned(g,nowMs))} |
| Паника в конце / максимум | ${g.panic||0} / ${Math.max(0,...(g.panicLog||[]).reduce((a,x)=>{a.push((a[a.length-1]||0)+x.d);return a;},[]))} |
| Ключевых улик на стене | ${keys.length} (${keys.map(k=>k.key).join(', ')||'—'}) |
| Первое упоминание причины в ленте | ${pack.rootCause?firstMention(pack.rootCause):'—'} |
| Действий вслепую | ${blind.length} |
| Ловушек сработало | ${traps.length} (${traps.map(t=>t.mitId).join(', ')||'—'}) |
| Статус-апдейтов | ${statuses.length}, максимальный перерыв ${gaps} |
| Звонок CIO | ${g.call?(g.call.result==='ok'?'отбит':g.call.result==='fail'?'провален':g.call.result==='timeout'?'сорван по таймауту':'шёл'):'не было'} |
| Применено | ${(g.applied||[]).join(', ')||'—'} |
${sec('Таймлайн',feed.map(e=>`- \`${fmtT(e.t)}\` ${e.msg}`))}${sec('Стена улик',wall.map(w=>`- \`${fmtT(w.t)}\` **${RO[w.role]?.short}** (${w.artifactId}${w.key?', '+w.key:''}): ${w.summary}`))}${sec('Гипотезы',hyps.map(h=>`- ${h.text} — ${h.status}`))}${sec('Действия',props.map(p=>`- \`${fmtT(p.t)}\` ${p.mitId} ${MIT[p.mitId]?.title||''} — ${RO[p.role]?.short}, ${p.status}${(p.cards||[]).length?', улик: '+p.cards.length:', вслепую'}${p.reviewedBy?', ревью: '+RO[p.reviewedBy]?.short:''}${p.goAt!=null?', Go '+fmtT(p.goAt):''}${p.doneAt!=null?', выполнено '+fmtT(p.doneAt):''}`))}${sec('Статус-апдейты',statuses.map(x=>`- \`${fmtT(x.t)}\` ${x.score!=null?x.score+' из 3'+(x.over?', обещан срок':''):'без оценки'}: ${x.text}`))}${sec('Журнал паники',(g.panicLog||[]).map(x=>`- \`${fmtT(x.t)}\` ${x.d>0?'+':''}${x.d} — ${x.why}`))}
## Вопросы для разбора

1. Когда в комнате впервые прозвучала настоящая причина? Что мешало раньше?
2. Какой сигнал перевернул главную ложную гипотезу?
3. Какие срезы противоречили друг другу и как IC их сводил?

5. Что клиенты/стейкхолдеры знали раньше инженеров?
`;
}
function exportTimeline(){
  const md=buildReport(STATE,P());const name='postmortem-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.md';
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Скачано: '+name);}
  catch(e){navigator.clipboard?.writeText(md).then(()=>toast('Скачать не удалось, скопировано в буфер'));}
}

async function downloadArchiveReport(file){
  try{const r=await fetch('/archive/'+file);const data=await r.json();const pack=window.SCENARIOS[data.state.game.scenarioId];if(!pack){toast('Пакет этого кейса не найден');return;}
    const md=buildReport(data.state,pack,Date.parse(data.summary.at)||Date.now());const name=file.replace(/\.json$/,'.md');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Скачано: '+name);}catch(e){toast('Не удалось собрать отчёт');}
}
function replayArchive(scenarioId,mode){S.lobbySel={scenarioId,mode:mode||'standard'};S.archiveView=null;location.hash='#gm';toast('Выбран кейс: '+scenarioId);}

/* ---------- Player ---------- */
function renderRolePicker(){
  return topbar()+`<div class="wrap stack" style="gap:16px">${offlineNote()}<div><h1>Выберите роль</h1><p class="muted">Роль занимает тот, кто первым нажал. Вернуться к выбору можно через «сменить роль».</p></div>
  <div class="row"><input type="text" id="pname" placeholder="Ваше имя" style="max-width:280px"></div>
  <div class="roles">${ROLE_ORDER().map(r=>{const p=S.players[r];const taken=!!(p&&p.name);return `<button class="rolecard ${taken?'taken':''}" onclick="claimRole('${r}')"><span class="pill ${ROLES()[r].color}">${ROLES()[r].short}</span><b>${ROLES()[r].name}</b><span class="hint">${ROLES()[r].desc}</span>${taken?`<span class="muted">занято: ${esc(p.name)}</span>`:''}</button>`;}).join('')}</div></div>`;
}
async function claimRole(r){const name=(document.getElementById('pname')?.value||'').trim();const p=S.players[r];if(p&&p.name&&!confirm(`Роль занята (${p.name}). Забрать?`))return;if(!name){toast('Введите имя');return;}await pWrite(r,{...(p||{}),name,claimedAt:Date.now()});try{localStorage.setItem('pn.role',r);}catch(e){}location.hash='#play/'+r;}
function leaveRole(){try{localStorage.removeItem('pn.role');}catch(e){}location.hash='#play';}

function renderPlayer(){
  const r=S.role;const R=ROLES()[r];const me=myPlayer()||{};const g=G();
  const hasHints=g.mode==='training'&&P().hints&&P().hints[r]&&P().hints[r].length;
  const tabs0=r==='commander'?['Доска','Действия','Стена','Памятка']:r==='comms'?['Данные','Статус','Стена','Действия','Памятка']:['Данные','Стена','Действия','Памятка'];
  const tabs=hasHints?[...tabs0.slice(0,-1),'Подсказки',tabs0[tabs0.length-1]]:tabs0;
  S.tab=S.tab||tabs[0];
  const tabbar=`<div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${S.tab===t}" onclick="S.tab='${t}';render()">${t}</button>`).join('')}</div>`;
  let body='';
  if(S.tab==='Данные')body=renderData(r,me);
  else if(S.tab==='Стена')body=renderWallTab(r,me);
  else if(S.tab==='Действия')body=renderActions(r,me);
  else if(S.tab==='Доска')body=renderBoard(me);
  else if(S.tab==='Статус')body=renderStatusTab(me);
  else if(S.tab==='Подсказки')body=renderHintsTab(r,me);
  else body=`<div class="card stack"><h2>${R.name}</h2><p>${R.desc}</p><div><div class="eyebrow">Ограничение</div><p>${R.limit}</p></div><div><div class="eyebrow">Стартовый экран</div><pre>${esc(START()[r])}</pre></div><div><div class="eyebrow">Как играть</div><ol style="padding-left:18px;margin:6px 0" class="stack"><li>Запросите данные — подождите цену в секундах. Один запрос в полёте.</li><li>Прочитали — расскажите команде голосом. Вывод вынесите на стену (140 знаков).</li><li>Действие на проде привяжите к карточке стены и отправьте IC на «Go».</li></ol></div><button class="sm" onclick="leaveRole()">сменить роль</button></div>`;
  return topbar(`<span class="pill ${R.color}">${R.short}</span><span class="muted">${esc(me.name||'')}</span>`)+`<div class="wrap">${offlineNote()}${tabbar}${body}</div>`;
}
function renderData(r,me){
  const list=ART().filter(a=>a.role===r);const rec=me.received||[];const inF=me.inFlight&&Date.now()<me.inFlight.readyAt?me.inFlight:null;
  const mult=costMult();const ic=S.players.commander;const syncFree=ic&&ic.syncAt&&ic.syncAt>(me.lastReqAt||0);
  const recIds=rec.map(x=>x.id);const visible=r==='scout'?recIds.slice(-2):recIds;
  const received=rec.slice().reverse().map(x=>{const a=ARTBY()[x.id];const lost=!visible.includes(x.id);const fu=a.followUp&&Date.now()-x.at>a.followUp.delay*1000;return `<div class="item ${lost?'done':''}"><div class="head"><span class="tool"><b>${a.id}</b> ${esc(a.tool)}</span><span class="cost">${fmtT(x.t)}</span></div>${lost?'<div class="hint">утеряно: туннельное зрение. Что успели проговорить — то и осталось.</div>':`<pre style="margin-top:8px">${esc(a.body)}${fu?'\n\n'+esc(a.followUp.body):''}</pre><div class="row" style="margin-top:8px"><button class="sm" onclick="S.tab='Стена';S.pinFor='${a.id}';render()">Вынести на стену</button></div>`}</div>`;}).join('');
  const hasDeepTrace=P().artifacts.some(a=>a.id==='S5'&&!a.decoy);
  const menu=list.filter(a=>!recIds.includes(a.id)).map(a=>{const cost=syncFree||me.freeNext===a.id?0:Math.round(a.cost*mult);const busy=inF&&inF.id===a.id;return `<div class="item ${busy?'pending':''}"><div class="head"><span class="tool">${esc(a.tool)}</span><span class="cost">${busy?`<span data-cd="${inF.readyAt}"></span>`:cost+' с'}</span></div>${busy?`<div class="progress"><i data-prog="${inF.startedAt},${inF.readyAt}"></i></div>`:`<div class="row" style="margin-top:6px"><button class="sm" onclick="requestArtifact('${a.id}')" ${inF?'disabled':''}>Запросить</button>${r==='scout'&&a.id==='S5'&&hasDeepTrace&&(me.deepTrace??2)>0?`<button class="sm primary" onclick="deepTrace()">Deep Trace (${me.deepTrace??2})</button>`:''}</div>`}</div>`;}).join('');
  const abil=r==='scout'?`<div class="hint">«Метрика под микроскопом» (раз в 7 минут): спросите GM вслух про одну метрику — причина это или следствие.</div>`:r==='platform'?`<div class="hint">«Drain & Isolate» и «Вернуть по манифесту» — во вкладке «Действия».</div>`:r==='domain'?`<div class="hint">«Feature Flag / Kill-Switch» и «Emergency Hotfix» — во вкладке «Действия».</div>`:'';
  return `<div class="stack" style="gap:14px">
    <div class="card"><div class="eyebrow">Стартовый экран</div><pre style="margin-top:8px">${esc(START()[r])}</pre></div>
    ${received?`<div><div class="eyebrow" style="margin-bottom:6px">Получено</div><div class="list">${received}</div></div>`:''}
    <div><div class="eyebrow" style="margin-bottom:6px">Запросить ${mult>1?'<span class="pill amber">паника: цены ×'+mult+'</span>':''}${syncFree?'<span class="pill violet">синхронизация: следующий запрос бесплатно</span>':''}</div><div class="list">${menu}</div></div>
    ${abil}</div>`;
}
async function deepTrace(){const me=myPlayer()||{};const n=(me.deepTrace??2);if(n<=0)return;await pWrite(S.role,{deepTrace:n-1,freeNext:'S5'});await requestArtifact('S5');}
function renderWallTab(r,me){
  const rec=me.received||[];
  const sel=S.pinFor||(rec[rec.length-1]?.id)||'';
  const form=r==='commander'?`<div class="hint">IC не выносит улики: у вас нет данных. Стена ниже — для чтения.</div>`:`<div class="card stack"><div class="eyebrow">Вынести вывод на стену</div>
    <select id="pinArt" onchange="S.pinFor=this.value">${rec.length?rec.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${x.id} · ${esc(ARTBY()[x.id].tool)}</option>`).join(''):'<option value="">сначала получите данные</option>'}</select>
    <textarea id="pinText" maxlength="140" placeholder="Вывод в 140 знаков. Не «вот дамп», а «4 потока держат коннекты к базе, 196 ждут»"></textarea>
    <div class="row"><button class="primary" onclick="pinToWall(document.getElementById('pinArt').value,document.getElementById('pinText').value);document.getElementById('pinText').value=''" ${rec.length?'':'disabled'}>На стену</button><span class="hint">GM отметит, если это ключевая улика: паника −1</span></div></div>`;
  const wall=S.wall.slice().reverse().map(w=>`<div class="wallcard ${w.key?'key':''}"><div class="who"><span>${fmtT(w.t)} · ${ROLES()[w.role]?.short} · ${w.artifactId}</span>${w.key?`<span class="k">${w.key}</span>`:''}</div>${esc(w.summary)}</div>`).join('')||'<div class="dim">Стена пуста</div>';
  return `<div class="stack" style="gap:14px">${form}<div><div class="eyebrow" style="margin-bottom:6px">Стена · ${S.wall.filter(w=>w.key).length} / ${keyTotal()} ключевых</div><div class="stack" style="gap:6px">${wall}</div></div></div>`;
}
function renderActions(r,me){
  const g=G();const mine=ARTM().filter(m=>m.role===r);
  const chips=S.wall.map(w=>`<span class="chip ${(S.selCards||[]).includes(w.id)?'on':''}" onclick="toggleCard('${w.id}')">${w.artifactId}: ${esc(w.summary.slice(0,50))}${w.summary.length>50?'…':''}</span>`).join('')||'<span class="dim">на стене пока ничего — действие будет вслепую (+2 паники)</span>';
  const form=r==='commander'?'':`<div class="card stack"><div class="eyebrow">Предложить действие</div>
    <select id="mitSel">${mine.map(m=>`<option value="${m.id}">${m.id} · ${esc(m.title)} · ${m.cost} с${m.review?' · ревью':''}</option>`).join('')}</select>
    <div class="hint">${mine.map(m=>`<b>${m.id}</b> — ${esc(m.hint||'')}`).join('<br>')}</div>
    <div class="eyebrow">Привязать улики со стены</div><div class="chips">${chips}</div>
    <button class="primary" onclick="propose(document.getElementById('mitSel').value,S.selCards||[]);S.selCards=[]">Отправить IC на «Go»</button></div>`;
  const props=S.props.slice().reverse().map(p=>{const m=MITBY()[p.mitId];const canReview=r!=='commander'&&r!=='comms'&&p.role!==r&&p.status==='pending'&&m?.review&&!p.reviewedBy;return `<div class="item ${p.status==='pending'?'pending':p.status==='done'?'done':''}"><div class="head"><span><b>${p.mitId}</b> ${esc(m?.title||'')}</span><span class="pill ${p.status==='go'?'amber':p.status==='done'?'green':p.status==='rejected'?'red':''}">${p.status}</span></div><div class="hint">${fmtT(p.t)} · ${ROLES()[p.role]?.short} · ${(p.cards||[]).length?(p.cards.length+' улик'):'вслепую'}${p.reviewedBy?' · ревью: '+ROLES()[p.reviewedBy]?.short:''}${m?.review&&!p.reviewedBy&&p.status==='pending'?' · без ревью GM бросит d10':''}</div>
    <div class="row" style="margin-top:6px">${canReview?`<button class="sm" onclick="updProp('${p.id}',{reviewedBy:'${r}'})">Ревью (+30 с)</button>`:''}${r==='commander'&&p.status==='pending'?`<button class="sm primary" onclick="icGo('${p.id}')" ${g.call&&g.call.active&&!S.players.comms?.shieldUsed?'disabled title="во время звонка Go недоступен"':''}>Go</button><button class="sm danger" onclick="updProp('${p.id}',{status:'rejected'})">Нет</button>`:''}${p.status==='go'?`<span class="hint">выполняется ${m?.cost+(p.reviewedBy?30:0)} с · GM применит эффект</span>`:''}</div></div>`;}).join('')||'<div class="dim">предложений нет</div>';
  return `<div class="stack" style="gap:14px">${form}<div><div class="eyebrow" style="margin-bottom:6px">Очередь действий</div><div class="list">${props}</div></div></div>`;
}
function toggleCard(id){S.selCards=S.selCards||[];const i=S.selCards.indexOf(id);i>=0?S.selCards.splice(i,1):S.selCards.push(id);render();}
async function icGo(id){const g=G();if(g.call&&g.call.active){toast('Во время звонка CIO «Go» недоступен');return;}await updProp(id,{status:'go',goAt:Math.round(ENGINE.gameSec(G()))});}
function renderBoard(me){
  const g=G();const canSync=!me.syncAt||ENGINE.gameSec(g)-(me.syncT||0)>=600;
  const hyps=S.hyps.map(h=>`<div class="item"><div class="head"><span>${esc(h.text)}</span><span class="pill ${h.status==='confirmed'?'green':h.status==='refuted'?'red':''}">${h.status==='open'?'открыта':h.status==='confirmed'?'подтверждена':'опровергнута'}</span></div><div class="row" style="margin-top:6px"><button class="sm ok" onclick="upsertHyp('${h.id}',{status:'confirmed'})">подтвердить</button><button class="sm danger" onclick="upsertHyp('${h.id}',{status:'refuted'})">опровергнуть</button><button class="sm" onclick="upsertHyp('${h.id}',{status:'open'})">открыть</button></div></div>`).join('')||'<div class="dim">Гипотез нет. Начните с трёх, которые команда назовёт первыми.</div>';
  const waiting=ROLE_ORDER().filter(x=>x!=='commander').map(x=>{const p=S.players[x];if(!p)return `<div class="dim">${ROLES()[x].short}: не подключён</div>`;const f=p.inFlight&&Date.now()<p.inFlight.readyAt;return `<div><b>${ROLES()[x].short}</b> ${esc(p.name||'')}: ${f?`ждёт данные <span class="mono" data-cd="${p.inFlight.readyAt}"></span>`:'свободен'}</div>`;}).join('');
  return `<div class="stack" style="gap:14px">
    <div class="card stack"><div class="eyebrow">Гипотезы</div><div class="row"><input type="text" id="hypText" placeholder="Например: это DDoS" style="flex:1;min-width:200px"><button class="primary" onclick="upsertHyp(null,{text:document.getElementById('hypText').value.trim()});document.getElementById('hypText').value=''">Добавить</button></div><div class="list">${hyps}</div></div>
    <div class="card stack"><div class="eyebrow">Кто чего ждёт</div>${waiting}</div>
    <div class="card stack"><div class="eyebrow">Синхронизация гипотез <span class="dim">(раз в 10 минут)</span></div><p class="hint">60 секунд: каждая роль называет один факт и одну гипотезу. Награда: следующий запрос каждого игрока — бесплатно.</p><button ${canSync&&g.status==='ACTIVE'?'':'disabled'} onclick="pWrite('commander',{syncAt:Date.now(),syncT:Math.round(ENGINE.gameSec(G()))})">Объявить синхронизацию</button></div>
    <div class="card stack"><div class="eyebrow">Стена</div>${S.wall.slice().reverse().map(w=>`<div class="wallcard ${w.key?'key':''}"><div class="who"><span>${ROLES()[w.role]?.short} · ${w.artifactId}</span>${w.key?`<span class="k">${w.key}</span>`:''}</div>${esc(w.summary)}</div>`).join('')||'<div class="dim">пусто</div>'}</div>
    <div class="card stack"><div class="eyebrow">Закрыть инцидент</div><p class="hint">Когда success ≥ 95% держится заданное время — объявите вслух. GM переведёт в Resolved. Поспешите — и откроете заново с +3 паники.</p></div>
  </div>`;
}
function renderHintsTab(r,me){
  const items=P().hints[r]||[];
  const recN=(me.received||[]).length;
  const pinsN=S.wall.filter(w=>w.role===r).length;
  const propsN=S.props.filter(p=>p.role===r).length;
  let step=0;if(recN>0)step++;if(pinsN>0)step++;if(propsN>0)step++;
  const cur=Math.min(step,items.length-1);
  const list=items.map((h,i)=>`<div class="item ${i<cur?'done':i===cur?'pending':''}"><span class="tool">${i<cur?'✅':i===cur?'👉':'·'} ${esc(h)}</span></div>`).join('');
  return `<div class="stack" style="gap:14px">
    <div class="card stack"><div class="eyebrow">Подсказки · учебный режим</div><p class="hint">Чек-лист вашей роли. Текущий шаг подсвечен; выполните его и двигайтесь дальше. На разборе эти шаги сравнят с тем, что вы сделали сами.</p></div>
    <div class="list">${list}</div></div>`;
}
function renderStatusTab(me){
  const g=G();const last=S.statuses.filter(s=>s.role==='comms').slice(-1)[0];const cd=last?300-(ENGINE.gameSec(g)-last.t):0;
  const list=S.statuses.slice().reverse().map(s=>`<div class="item"><div class="head"><b>${fmtT(s.t)}</b>${s.score!=null?`<span class="pill ${s.score>=2?'green':'red'}">${s.score} из 3${s.over?' · обещан срок':''}</span>`:'<span class="pill">ждёт оценки GM</span>'}</div><div style="margin-top:4px">${esc(s.text)}</div></div>`).join('');
  return `<div class="stack" style="gap:14px">
    <div class="card stack"><div class="eyebrow">Статус-пейдж апдейт <span class="dim">(раз в 5 минут)</span></div>
    <div class="hint">GM оценит по трём пунктам: 1) что не работает и что работает, словами клиента; 2) что делаем, без непроверенной причины; 3) время следующего апдейта. Обещанный срок починки — +1 паники.</div>
    <textarea id="stText" placeholder="Например: Оплата картой в приложении временно недоступна, оплата через СБП работает. Команда локализует причину, деньги не списываются. Следующее обновление через 5 минут."></textarea>
    <button class="primary" ${cd>0?'disabled':''} onclick="publishStatus(document.getElementById('stText').value);document.getElementById('stText').value=''">${cd>0?'Следующий через '+fmtT(cd):'Опубликовать'}</button></div>
    <div class="card stack"><div class="eyebrow">Щит от C-level <span class="dim">(1 раз)</span></div><p class="hint">Перехватить звонок CIO. За 60 секунд: влияние словами бизнеса, гипотеза и уверенность, время следующего чекпойнта. Вслух. GM решит.</p><button ${me.shieldUsed||!(g.call&&g.call.active)?'disabled':''} onclick="pWrite('comms',{shieldUsed:true})">Беру звонок на себя</button>${me.shieldUsed?'<span class="hint">использовано</span>':''}</div>
    <div class="list">${list}</div></div>`;
}

boot();
</script>

</body>
</html>
