<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инцидент-тренировка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F1E33'/%3E%3Crect x='6' y='18' width='5' height='8' fill='%23FFD84D'/%3E%3Crect x='13.5' y='12' width='5' height='14' fill='%23FFD84D'/%3E%3Crect x='21' y='6' width='5' height='20' fill='%23C8102E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/theme.css">
<style>
  /* Токены цветов и шрифтов — theme.css. Правила — .claude/skills/inc-workshop-ui/SKILL.md. */
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  [hidden], .hidden { display: none !important; }
  h1, h2, h3 { font-family: var(--cond); font-weight: 700; line-height: 1.08; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }
  .view { display: none; min-height: 100vh; }
  .view.on { display: block; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 44px; border: 2px solid var(--ink); background: transparent; border-radius: 6px; padding: .5rem 1.1rem; font-family: var(--cond); font-weight: 600; font-size: 1.1rem; cursor: pointer; text-align: center; }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.danger { border-color: var(--sev); color: var(--sev); }
  .btn.danger:hover:not(:disabled) { background: var(--sev); color: #fff; }
  .btn.small { min-height: 36px; padding: .25rem .7rem; font-size: .95rem; }
  .panel { background: var(--sheet); border: 2px solid var(--rule); border-radius: 10px; padding: 1rem 1.1rem; }
  .panel > h3 { font-size: 1.05rem; font-weight: 600; color: var(--muted); margin-bottom: .5rem; }
  .tag { display: inline-block; font-family: var(--cond); font-weight: 700; padding: .15rem .65rem; border-radius: 4px; }
  .tag.best { background: var(--ok-bg); color: var(--ok); }
  .tag.ok { background: var(--warn-bg); color: var(--ink); box-shadow: inset 3px 0 0 var(--warn); }
  .tag.weak { background: var(--idle-bg); color: var(--muted); }
  .tag.trap { background: var(--sev); color: #fff; }
  .num-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7em; height: 1.7em; border: 2px solid currentColor; border-radius: 5px; font-family: var(--cond); font-weight: 700; flex: none; }

  /* Баннеры: связь и ошибки рендера. */
  .banner { position: fixed; left: 0; right: 0; top: 0; z-index: 40; padding: .55rem 1rem; font-weight: 600; text-align: center; }
  .banner.warn { background: var(--warn-bg); color: var(--ink); border-bottom: 2px solid var(--warn); }
  .banner.err { background: var(--sev); color: #fff; }
  .banner button { margin-left: .8rem; background: #fff; color: var(--sev); border: 0; border-radius: 4px; padding: .2rem .7rem; font-weight: 700; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: .7rem 1.2rem; border-radius: 6px; z-index: 50; max-width: calc(100vw - 2rem); }

  /* Диаграмма архитектуры: компонент шага подсвечен, остальные приглушены. */
  svg.diag { width: 100%; height: auto; display: block; }
  .d-box { stroke-width: 2; }
  .d-box.c-red { fill: var(--sev-bg); stroke: var(--sev); }
  .d-box.c-yellow { fill: var(--warn-bg); stroke: var(--warn); }
  .d-box.c-green { fill: var(--ok-bg); stroke: var(--ok); }
  .d-box.c-gray { fill: var(--idle-bg); stroke: var(--rule-strong); }
  .d-label { fill: var(--ink); font: 600 17px var(--cond); text-anchor: middle; }
  .d-note { fill: var(--muted); font: 13px var(--sans); text-anchor: middle; }
  .d-edge { stroke: var(--muted); stroke-width: 1.8; fill: none; }
  .d-arrow { fill: var(--muted); }
  .d-elabel { fill: var(--muted); font: 13px var(--sans); text-anchor: middle; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; }
  svg.has-focus .d-node { opacity: .6; }
  svg.has-focus .d-node.focus { opacity: 1; }
  .d-node.focus .d-box { stroke: var(--ink); stroke-width: 3.5; }
  .legend { display: flex; gap: .9rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: .4rem; }
  .legend i { display: inline-block; width: .8em; height: .8em; border-radius: 2px; margin-right: .3em; vertical-align: -.05em; border: 2px solid; }

  /* Шкалы метрик */
  .meter { display: grid; grid-template-columns: 1fr auto; gap: .2rem .8rem; align-items: baseline; }
  .meter .m-name { font-family: var(--cond); font-weight: 600; color: var(--muted); }
  .meter .m-val { font-family: var(--cond); font-weight: 700; font-size: 1.6rem; line-height: 1; }
  .meter .m-delta { font-family: var(--cond); font-weight: 600; font-size: 1rem; margin-left: .4rem; }
  .meter .m-track { grid-column: 1 / -1; height: .65rem; background: var(--idle-bg); border-radius: 4px; overflow: hidden; position: relative; }
  .meter .m-fill { position: absolute; inset: 0 auto 0 0; transition: width .9s cubic-bezier(.3,.7,.2,1), background .6s; }
  .meter .m-base { position: absolute; top: -2px; bottom: -2px; border-left: 2px dashed var(--ink); opacity: .55; }
  .lvl-low { background: var(--ok); } .lvl-mid { background: var(--warn); } .lvl-high { background: var(--sev); }
  .up { color: var(--sev); } .down { color: var(--ok); }

  /* ================= Проектор ================= */
  /* Проектор: кегль от ширины и высоты — на 1280×720 всё влезает без прокрутки, на 1080p читается с 10 м. */
  html.v-screen { font-size: clamp(14px, min(1.12vw + 4px, 1.9vh + 3px), 26px); }
  #screen .wrap { max-width: 1680px; margin: 0 auto; padding: 1.1rem 1.8rem 1.3rem; }
  .s-bar { display: flex; justify-content: space-between; align-items: baseline; gap: 1.2rem; flex-wrap: wrap; padding-bottom: .7rem; border-bottom: 2px solid var(--rule); }
  .s-bar .case { font-family: var(--cond); font-weight: 600; font-size: 1.1rem; }
  .s-bar .step { color: var(--muted); margin-left: .8rem; }
  .s-bar .right { display: flex; gap: 1.6rem; align-items: baseline; }
  .phase { font-family: var(--cond); font-weight: 700; font-size: 1.15rem; background: var(--tag); color: var(--tag-ink); padding: .1rem .7rem; border-radius: 4px; }
  .timer { font-family: var(--mono); font-weight: 600; font-size: 1.3rem; }
  .timer.over { color: var(--sev); }
  .s-score { font-family: var(--cond); font-weight: 600; color: var(--muted); }
  .s-score b { font-size: 1.8rem; color: var(--ink); margin-left: .3rem; }
  .s-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 1.6rem; margin-top: 1rem; align-items: start; }
  .s-title { font-size: 2.5rem; margin-bottom: .7rem; }
  .s-brief { font-size: 1.3rem; line-height: 1.5; max-width: 62ch; white-space: pre-wrap; }
  .s-question { font-family: var(--cond); font-weight: 700; font-size: 1.6rem; margin: 1rem 0 .6rem; }
  .s-options { display: flex; flex-direction: column; gap: .5rem; list-style: none; margin: 0; padding: 0; }
  .s-options li { display: flex; gap: .9rem; align-items: center; background: var(--sheet); border: 2px solid var(--rule); border-radius: 8px; padding: .55rem 1rem; font-size: 1.25rem; }
  .s-aside { display: flex; flex-direction: column; gap: .9rem; }
  .s-metrics { display: flex; flex-direction: column; gap: .7rem; }
  .s-votes { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .9rem; align-items: center; }
  .s-votes .lbl { font-family: var(--cond); font-weight: 700; font-size: 1.25rem; margin-right: .4rem; }
  .chip { font-family: var(--cond); font-weight: 600; font-size: 1rem; padding: .15rem .6rem; border-radius: 4px; border: 2px solid var(--rule); color: var(--muted); }
  .chip.on { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
  .s-picked { font-size: 1.15rem; color: var(--muted); margin-bottom: .4rem; }
  .s-picked b { color: var(--ink); font-weight: 600; }
  .s-reveal { font-size: 1.55rem; line-height: 1.45; max-width: 52ch; margin-top: .8rem; }
  .s-delta { display: flex; gap: 1.2rem; align-items: baseline; flex-wrap: wrap; }
  .s-delta .tag { font-size: 1.4rem; }
  .s-delta .pts { font-family: var(--cond); font-weight: 700; font-size: 3.2rem; line-height: 1; }
  .s-delta .pts small { font-size: 1.2rem; color: var(--muted); margin-left: .3rem; font-weight: 600; }
  .s-lobby { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 2rem; margin-top: 1.2rem; align-items: start; }
  .s-lobby h1 { font-size: 3.4rem; letter-spacing: -.01em; }
  .s-lobby .lead { font-size: 1.35rem; color: var(--muted); margin-top: .6rem; max-width: 46ch; }
  .s-join { margin-top: 1.4rem; }
  .s-join .url { font-family: var(--mono); font-weight: 600; font-size: 1.2rem; overflow-wrap: anywhere; }
  .seats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .45rem; }
  .seats li { display: flex; justify-content: space-between; gap: 1rem; font-size: 1.2rem; padding: .35rem 0; border-bottom: 1px solid var(--rule); }
  .seats .free { color: var(--muted); }
  .seats .taken { color: var(--ok); font-weight: 600; }
  .s-final-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: end; padding-bottom: .8rem; border-bottom: 2px solid var(--rule); margin-top: .6rem; }
  .s-final-head h1 { font-size: 3rem; }
  .s-final-head p { margin-top: .4rem; font-size: 1.05rem; color: var(--muted); max-width: 56ch; }
  .metrics { display: flex; gap: 2rem; flex-wrap: wrap; }
  .metric { font-family: var(--cond); }
  .metric b { display: block; font-size: 2rem; font-weight: 700; line-height: 1; }
  .metric span { color: var(--muted); font-weight: 600; }
  .recap { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .recap li { counter-increment: s; display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 0 .8rem; padding: .3rem 0; border-bottom: 1px solid var(--rule); }
  .recap li::before { content: counter(s); font-family: var(--cond); font-weight: 700; font-size: 1.15rem; color: var(--muted); }
  .recap .r-title { font-family: var(--cond); font-weight: 600; font-size: 1rem; }
  .recap .r-pick, .recap .r-better { grid-column: 2; font-size: .85rem; line-height: 1.35; }
  .recap .r-better { color: var(--muted); }
  .recap .r-pts { grid-row: 1 / span 2; grid-column: 3; font-family: var(--cond); font-weight: 700; font-size: 1.25rem; align-self: center; text-align: right; }
  .s-cause { font-size: .95rem; line-height: 1.5; white-space: pre-wrap; }
  @media (max-height: 820px) and (min-width: 641px) {
    #screen .wrap { padding-top: .8rem; padding-bottom: .8rem; }
    .s-title { font-size: 2rem; margin-bottom: .5rem; }
    .s-brief { font-size: 1.2rem; }
    .s-question { font-size: 1.4rem; margin: .7rem 0 .45rem; }
    .s-options li { padding: .4rem .9rem; font-size: 1.15rem; }
    .s-reveal { font-size: 1.35rem; }
    .s-lobby h1, .s-final-head h1 { font-size: 2.6rem; }
  }

  /* ================= Телефон роли ================= */
  #play .wrap { max-width: 640px; margin: 0 auto; padding: .8rem 1rem 2rem; }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; padding-bottom: .6rem; border-bottom: 2px solid var(--rule); }
  .p-head .who { font-family: var(--cond); font-weight: 700; font-size: 1.3rem; }
  .p-head .where { color: var(--muted); font-size: .9rem; text-align: right; }
  .p-roles { display: flex; flex-direction: column; gap: .6rem; margin-top: 1rem; }
  .p-roles .btn { justify-content: space-between; width: 100%; font-size: 1.2rem; min-height: 56px; }
  .p-roles .btn small { font-family: var(--sans); font-weight: 400; font-size: .85rem; color: inherit; opacity: .8; }
  .p-sect { margin-top: 1rem; }
  .p-sect h2 { font-size: 1.35rem; margin-bottom: .4rem; }
  .p-status { margin-top: .9rem; padding: .6rem .8rem; border-radius: 6px; background: var(--sheet); border: 2px solid var(--rule); font-weight: 600; }
  .p-status.go { border-color: var(--ink); background: var(--tag); color: var(--tag-ink); }
  pre.data { margin: 0; font-family: var(--mono); font-size: .86rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; background: var(--sheet); border: 2px solid var(--rule); border-radius: 8px; padding: .7rem .8rem; }
  .deliver { margin-top: .7rem; border-left: 5px solid var(--tag); background: var(--sheet); padding: .55rem .8rem; border-radius: 0 6px 6px 0; }
  .deliver b { font-family: var(--cond); font-weight: 600; }
  .p-vote { display: flex; flex-direction: column; gap: .55rem; margin-top: .6rem; }
  .p-vote .btn { justify-content: flex-start; text-align: left; width: 100%; min-height: 52px; font-family: var(--sans); font-weight: 500; font-size: 1rem; }
  .p-vote .btn.mine { background: var(--ink); color: var(--paper); opacity: 1; }
  .p-note { color: var(--muted); font-size: .9rem; margin-top: .6rem; }

  /* ================= Пульт ведущего ================= */
  #gm .wrap { max-width: 1440px; margin: 0 auto; padding: 1rem 1.4rem 2rem; }
  .g-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding-bottom: .7rem; border-bottom: 2px solid var(--rule); }
  .g-bar .case { font-family: var(--cond); font-weight: 700; font-size: 1.3rem; }
  .g-bar .info { display: flex; gap: 1.1rem; align-items: center; flex-wrap: wrap; font-family: var(--cond); font-weight: 600; color: var(--muted); }
  .g-bar .info b { color: var(--ink); }
  .g-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1.2rem; margin-top: 1rem; align-items: start; }
  .g-col { display: flex; flex-direction: column; gap: 1rem; }
  .g-step h2 { font-size: 1.7rem; }
  .g-hint { margin-top: .6rem; border-left: 5px solid var(--tag); padding: .3rem 0 .3rem .8rem; }
  .g-actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  .g-tally { font-family: var(--cond); font-weight: 600; font-size: 1.15rem; margin-bottom: .6rem; }
  .g-opts { display: flex; flex-direction: column; gap: .5rem; }
  .g-opt { border: 2px solid var(--rule); border-radius: 8px; padding: .55rem .75rem; display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .7rem; align-items: start; }
  .g-opt.chosen { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .g-opt .lbl { font-weight: 600; }
  .g-opt .meta { grid-column: 2 / -1; font-size: .85rem; color: var(--muted); }
  .g-opt .deb { grid-column: 2 / -1; font-size: .9rem; }
  .g-opt .cnt { font-family: var(--cond); font-weight: 700; font-size: 1.3rem; text-align: right; }
  .g-votes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
  .g-votes li { display: grid; grid-template-columns: 11rem 1fr; gap: .6rem; align-items: center; min-height: 40px; border-bottom: 1px solid var(--rule); }
  .g-votes select { padding: .3rem .4rem; border: 2px solid var(--rule); border-radius: 6px; background: var(--paper); max-width: 100%; }
  .g-priv { border-top: 1px solid var(--rule); padding-top: .6rem; margin-top: .6rem; }
  .g-priv:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .g-priv h4 { margin: 0 0 .3rem; font-family: var(--cond); font-size: 1.05rem; display: flex; justify-content: space-between; gap: .6rem; }
  .g-priv pre.data { font-size: .8rem; max-height: 14rem; overflow: auto; }
  .g-priv .deliver { margin-top: .4rem; font-size: .92rem; }
  .g-form { display: flex; flex-direction: column; gap: .8rem; }
  .g-form label { font-family: var(--cond); font-weight: 600; }
  .g-form input, .g-form select { width: 100%; margin-top: .3rem; padding: .5rem .7rem; border: 2px solid var(--rule); border-radius: 6px; background: var(--paper); min-height: 44px; }
  .g-cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: .8rem; }
  .g-case { text-align: left; background: var(--sheet); border: 2px solid var(--rule); border-radius: 10px; padding: .8rem 1rem; cursor: pointer; }
  .g-case[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .g-case h3 { font-size: 1.25rem; margin-bottom: .3rem; }
  .g-case p { color: var(--muted); font-size: .9rem; }
  /* Разрушительные действия — отдельной зоной, далеко от частых кнопок. */
  .g-danger { margin-top: 3rem; border: 2px dashed var(--sev); border-radius: 10px; padding: 1rem 1.1rem; }
  .g-danger h3 { color: var(--sev); font-size: 1.1rem; margin-bottom: .6rem; }
  .g-links { font-size: .9rem; color: var(--muted); display: flex; gap: 1.2rem; flex-wrap: wrap; }
  .g-links a { color: var(--info); }
  .note-warn { background: var(--warn-bg); color: var(--ink); border-left: 4px solid var(--warn); padding: .3rem .6rem; border-radius: 0 4px 4px 0; font-weight: 600; }
  .g-storage { margin: .6rem 0; }
  .g-pin { max-width: 22rem; margin: 18vh auto 0; }
  .g-pin input { font-size: 1.6rem; letter-spacing: .3em; text-align: center; }
  .g-final ol { margin: 0; padding-left: 1.3rem; }
  .g-final li { margin-bottom: .35rem; }

  /* ================= Карточки для печати ================= */
  #cards .wrap { max-width: 900px; margin: 0 auto; padding: 1rem; }
  .card { border: 2px solid var(--ink); border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem; break-inside: avoid; background: var(--sheet); }
  .card h2 { font-size: 1.5rem; }
  .card h3 { font-size: 1.1rem; margin-top: .8rem; }
  .card-role { break-before: page; }
  @media print {
    :root { --paper: #fff; }
    .no-print { display: none !important; }
    .card { border-color: #000; }
    pre.data { border-color: #999; }
  }


  /* QR, голос зала, звук, настройки, аналитика */
  .s-join { display: flex; gap: 1.4rem; align-items: center; }
  .s-qr { flex: none; width: 11rem; }
  .s-qr svg.qr { width: 100%; height: auto; display: block; border-radius: 6px; }
  .s-aud-count { font-family: var(--cond); font-weight: 600; color: var(--muted); margin-left: .6rem; }
  .s-aud { margin-top: 1rem; max-width: 34rem; }
  .s-aud-title { font-family: var(--cond); font-weight: 600; color: var(--muted); margin-bottom: .35rem; }
  .s-aud-row { display: grid; grid-template-columns: auto 1fr 3.2rem; gap: .1rem .6rem; align-items: center; margin-bottom: .35rem; font-size: .9rem; }
  .s-aud-row .num-badge { grid-column: 1; grid-row: 1 / span 2; font-size: .8rem; }
  .s-aud-label { grid-column: 2; grid-row: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s-aud-track { grid-column: 2; grid-row: 2; height: .5rem; background: var(--idle-bg); border-radius: 4px; overflow: hidden; position: relative; }
  .s-aud-pct { grid-column: 3; grid-row: 1 / span 2; font-family: var(--cond); font-weight: 700; text-align: right; }
  .s-aud-fill { position: absolute; inset: 0 auto 0 0; background: var(--info); }
  .s-aud-row.chosen .s-aud-fill { background: var(--ink); }
  .s-aud-row.chosen .num-badge { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .s-sound { margin-top: .6rem; padding: .4rem .7rem; border-radius: 6px; background: var(--info-bg); color: var(--ink); font-size: .9rem; }
  .p-code { width: 100%; min-height: 48px; font-size: 1.4rem; letter-spacing: .15em; text-align: center; border: 2px solid var(--rule); border-radius: 6px; background: var(--sheet); margin-top: .6rem; }
  .g-inline { display: flex; gap: .5rem; align-items: center; margin-top: .3rem; }
  .g-inline input { margin-top: 0; flex: 1; min-width: 0; }
  .g-check { display: flex; gap: .5rem; align-items: center; font-family: var(--sans); font-weight: 400; }
  .g-check input { width: 1.3rem; height: 1.3rem; margin: 0; min-height: 0; }
  #stats .wrap { max-width: 1200px; margin: 0 auto; padding: 1.2rem 1.4rem 2rem; }
  #stats h1 { font-size: 2.2rem; }
  .st-case { margin-top: 1.2rem; }
